name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -v

  # Compila exe portabile e MSI a ogni push: un problema di pacchetto si vede subito,
  # non il giorno della release.
  build:
    name: Build (exe + msi)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet tool install --global wix --version 5.0.2
      - name: Exe portabile + autotest
        run: ./build.ps1
        shell: pwsh
      - name: Installer MSI
        run: ./build_msi.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: SPVault
          path: |
            dist/SPVault.exe
            dist/*.msi
          if-no-files-found: error
